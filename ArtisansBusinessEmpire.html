<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Artisan's Business Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#FFF9F5; --rose:#C48A8F; --red:#A4443E; --redDark:#8A352F;
    --sage:#7E9E80; --sageDeep:#4E7350; --amber:#C89B3C; --peach:#D4A37E; --ink:#2A1F1E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Raleway',sans-serif; color:var(--ink); background:var(--cream); min-height:100vh; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px; margin:0 auto; padding:20px 18px 48px;}
  h1,h2,h3{margin:0;}
  .fade{animation:fadeUp .35s ease both;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:none;}}
  @keyframes barfill{from{width:0;}to{width:100%;}}
  @keyframes beemove{from{left:0%;}to{left:100%;}}
  @keyframes beebob{0%,100%{transform:translate(-50%,-50%) rotate(-4deg);}50%{transform:translate(-50%,-62%) rotate(4deg);}}
  button{font-family:'Raleway',sans-serif;}
  .btn{font-weight:600; font-size:15px; letter-spacing:.04em; border-radius:4px; padding:11px 26px; cursor:pointer; border:none; background:var(--red); color:var(--cream); transition:background .15s, opacity .15s;}
  .btn:hover{background:var(--redDark);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn:disabled:hover{background:var(--red);}
  .btn.outline{background:transparent; color:var(--red); border:1.5px solid var(--red);}
  .btn.outline:hover{background:rgba(164,68,62,.08);}
  .card{border:1.5px solid rgba(42,31,30,.15); background:#fff; border-radius:8px; padding:12px 14px; cursor:pointer; transition:border .15s, background .15s;}
  .card.sel{border:1.5px solid var(--red); background:rgba(196,138,143,.14);}
  .card.chosen{background:#F7E6D7; border-color:rgba(212,163,126,.65);}
  .card.dis{opacity:.45; cursor:default;}
  .grid{display:grid; gap:10px;}
  .panel{background:#fff; border:1.5px solid rgba(42,31,30,.1); border-radius:12px; padding:26px 28px;}
  .seclbl{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .secnum{background:var(--amber); color:#fff; width:24px; height:24px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;}
  .sech{font-weight:600; font-size:20px; color:var(--red);}
  .slider{-webkit-appearance:none; appearance:none; height:6px; border-radius:3px; background:var(--peach); outline:none;}
  .slider::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:22px; height:22px; border-radius:50%; background:var(--red); cursor:pointer; border:2px solid #fff;}
  .slider::-moz-range-thumb{width:22px; height:22px; border-radius:50%; background:var(--red); cursor:pointer; border:2px solid #fff;}
  .bar{display:flex; align-items:center; justify-content:space-between; background:#fff; border:1.5px solid rgba(42,31,30,.1); border-radius:8px; padding:10px 14px; margin-bottom:18px; position:sticky; top:8px; z-index:5;}
  .avimg{object-fit:cover; background:var(--cream); border-radius:50%;}
  .avpick{border-radius:50%; cursor:pointer; border:3px solid transparent; object-fit:cover; background:var(--cream); transition:border .15s;}
  .avpick:hover{border-color:var(--peach);}
  .avpick.on{border-color:var(--red);}
  .xbtn{width:34px; height:34px; border-radius:6px; border:1.5px solid var(--red); background:#fff; color:var(--red); font-size:18px; font-weight:700; cursor:pointer; line-height:1;}
  .row{display:flex; justify-content:space-between; font-size:14px; padding:2px 0;}
  .row.b{font-weight:700;}
  .stat{background:var(--cream); border-radius:8px; padding:10px 12px;}
  .stat .lab{font-size:11px; opacity:.65; font-weight:600;}
  .stat .val{font-size:16px; font-weight:700; margin-top:2px;}
  .track{position:relative; height:16px; border-radius:8px; background:var(--peach); overflow:hidden;}
  .trackfill{height:100%; background:var(--amber); width:0; animation:barfill 3s ease forwards;}
  .bee{position:absolute; top:50%; left:0; animation:beemove 3s ease forwards;}
  .bee svg{animation:beebob .5s ease-in-out infinite;}
</style>
</head>

  if(p<100)return "Hobby Crafter";

  if(p<1100)return "Booth Boss";
  if(p<1600)return "Market Maven";
  return "Artisan Empire Builder";
}
function randMarket(){return MARKETS[Math.floor(Math.random()*MARKETS.length)];}
function boothObj(){return BOOTHS.filter(function(b){return b.id===S.booth;})[0];}
function adObj(){return ADS.filter(function(a){return a.id===S.ads;})[0];}
function avatarSrc(n){return AV["avatar"+n];}
function lineOfKey(k){return k.split(":")[0];}
function prodOfKey(k){return k.split(":")[1];}
function productName(k){return prodOfKey(k)+" "+LINES[lineOfKey(k)].name;}
function idSafe(k){return k.replace(/:/g,"_");}
function lifespanOf(lineId){return PERISH[lineId]||Infinity;}

/* inventory batches: S.inv[key] = [{qty, made}] */
function stockOf(k){var a=S.inv[k];if(!a)return 0;var t=0;for(var i=0;i<a.length;i++)t+=a[i].qty;return t;}
function totalStock(){var t=0;Object.keys(S.inv).forEach(function(k){t+=stockOf(k);});return t;}
function addBatch(k,qty,round){if(qty<=0)return;if(!S.inv[k])S.inv[k]=[];S.inv[k].push({qty:qty,made:round});}
function consume(k,n){var a=S.inv[k];if(!a)return 0;a.sort(function(x,y){return x.made-y.made;});var need=n,got=0;
  for(var i=0;i<a.length&&need>0;i++){var take=Math.min(a[i].qty,need);a[i].qty-=take;need-=take;got+=take;}
  S.inv[k]=a.filter(function(b){return b.qty>0;});return got;}
function expiresThisRound(k,round){var a=S.inv[k];if(!a||!a.length)return false;var L=lifespanOf(lineOfKey(k));if(L===Infinity)return false;
  for(var i=0;i<a.length;i++){if(a[i].made+L-1<=round)return true;}return false;}
function runExpiry(round){var lost=[];Object.keys(S.inv).forEach(function(k){var L=lifespanOf(lineOfKey(k));if(L===Infinity)return;
  var a=S.inv[k],keep=[],rem=0;for(var i=0;i<a.length;i++){if(a[i].made+L-1<=round)rem+=a[i].qty;else keep.push(a[i]);}
  if(rem>0)lost.push({key:k,qty:rem});S.inv[k]=keep;});return lost;}

function makeLinesThisRound(){var set={};Object.keys(S.make).forEach(function(k){if(S.make[k]>0)set[lineOfKey(k)]=true;});return Object.keys(set);}
function activeLines(){var s={};S.selectedLines.forEach(function(l){s[l]=true;});makeLinesThisRound().forEach(function(l){s[l]=true;});return Object.keys(s);}
function isLocked(lineId){var a=activeLines();return a.length>=3&&a.indexOf(lineId)<0;}
function cheapestAccessibleCost(){var lines=(S.selectedLines.length>=3)?S.selectedLines:LINE_ORDER;var m=Infinity;lines.forEach(function(l){if(LINES[l].cost<m)m=LINES[l].cost;});return m;}

function plannedMaterials(){var t=0;Object.keys(S.make).forEach(function(k){t+=(S.make[k]||0)*LINES[lineOfKey(k)].cost;});return t;}
function plannedUnits(){var t=0;Object.keys(S.make).forEach(function(k){t+=(S.make[k]||0);});return t;}
function calc(){
  var mat=plannedMaterials();var fixed=boothObj().cost+adObj().cost;var roundCost=mat+fixed;
  var carry=totalStock();var makeTotal=plannedUnits();
  var willHaveSomething=(carry+makeTotal)>0;
  var tooManyLines=activeLines().length>3;
  var afford=roundCost<=S.cash;
  var canConfirm=afford&&willHaveSomething&&!tooManyLines;
  return {mat:mat,fixed:fixed,roundCost:roundCost,carry:carry,makeTotal:makeTotal,willHaveSomething:willHaveSomething,tooManyLines:tooManyLines,afford:afford,canConfirm:canConfirm};
}

function pickEvent(round){
  var forceNonNeg=(S.negStreak>=2)||(((S.negTotal+1)/round)>0.40);
  var ids=Object.keys(EVENTS).filter(function(id){return forceNonNeg?!EVENTS[id].neg:true;});
  var total=0;ids.forEach(function(id){total+=EVENTS[id].w;});
  var r=Math.random()*total,acc=0,chosen=ids[0];
  for(var i=0;i<ids.length;i++){acc+=EVENTS[ids[i]].w;if(r<=acc){chosen=ids[i];break;}}
  return chosen;
}

function enterRound(){
  S.market=randMarket();
  S.event=pickEvent(S.round);
  var ev=EVENTS[S.event];
  S.negStreak=ev.neg?S.negStreak+1:0;
  S.negTotal+=ev.neg?1:0;
  S.trendingLine=(ev.special==="trending")?LINE_ORDER[Math.floor(Math.random()*LINE_ORDER.length)]:null;
  S.make={};S.lineToday=null;S.booth="budget";S.ads="none";
  S.screen="round";
}

    if(r._flavor) revealText=r._flavor; // keep stable across re-renders
    else { r._flavor=revealText; }
    html=topBar()+'<div class="fade panel">'+
      '<div style="font-size:13px;color:var(--sage);font-weight:600;">Round '+r.round+' of '+TOTAL_ROUNDS+', '+r.market+'</div>'+
      '<h2 style="font-weight:700;font-size:26px;color:var(--red);margin:4px 0 14px;">The market wraps up</h2>'+
      '<div style="background:var(--cream);border-left:4px solid var(--amber);padding:12px 16px;border-radius:6px;font-style:italic;margin-bottom:16px;">'+revealText+'</div>'+
      '<div style="font-size:14px;margin-bottom:6px;">Weather today: <strong>'+EVENTS[r.event].weather+'</strong>.</div>'+
      '<div style="font-size:15px;margin-bottom:14px;"><strong>'+r.visitors+'</strong> shoppers came to the market today.</div>';

    // sales breakdown
    html+='<div style="font-size:13px;font-weight:700;color:var(--red);margin-bottom:6px;">What sold</div>';
    if(r.soldList.length){
      html+='<div style="background:var(--cream);border-radius:8px;padding:10px 14px;margin-bottom:16px;">';
      r.soldList.forEach(function(s){
        html+='<div style="display:flex;justify-content:space-between;font-size:14px;padding:2px 0;"><span>'+s.qty+' '+productName(s.key)+'</span><span style="font-weight:600;color:var(--sageDeep);">'+money(s.qty*LINES[s.line].price)+'</span></div>';
      });
      html+='</div>';
    } else {
      html+='<div style="font-size:14px;opacity:.7;margin-bottom:16px;">Nothing sold today.</div>';
    }

    // money stats
    html+='<div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:16px;">'+
      statBox("Revenue", money(r.revenue), BRAND.sageDeep)+
      statBox("Spent this round", money(r.cost))+
      statBox("Net profit", money(r.profit), r.profit>=0?BRAND.sageDeep:BRAND.red)+
      statBox("Cash on hand", money(r.cashAfter), BRAND.sageDeep)+
    '</div>';

    // notes
    var notes="";
    notes+='<div style="font-size:13px;color:var(--ink);opacity:.85;margin:4px 0;">Favored today: '+r.favored.map(function(f){return LINES[f].name;}).join(" and ")+'.</div>';
    if(r.trending){notes+='<div style="font-size:13px;color:var(--amber);font-weight:700;margin:4px 0;">Trending today: '+LINES[r.trending].name+'. It drew extra interest.</div>';}
    if(r.bulk){
      if(r.bulk.fill>0){notes+='<div style="font-size:13px;color:var(--sageDeep);font-weight:700;margin:4px 0;">Bulk order: a customer bought '+r.bulk.fill+' '+productName(r.bulk.key)+' for '+money(r.bulk.rev)+'.</div>';}
      else{notes+='<div style="font-size:13px;color:var(--peach);font-weight:700;margin:4px 0;">A customer wanted a bulk order of '+r.bulk.want+' units, but you had nothing in stock to fill it.</div>';}
      notes+='<div style="font-size:12px;opacity:.7;font-style:italic;margin:2px 0 4px;">A bulk order is one large purchase that turns up on some days. Keep extra stock on hand to fill it.</div>';
    }
    if(r.expired&&r.expired.length){
      notes+='<div style="font-size:13px;color:var(--red);font-weight:700;margin:4px 0;">Expired and discarded: '+r.expired.map(function(e){return e.qty+' '+productName(e.key);}).join(", ")+'.</div>';
    }
    html+=notes;

    // full inventory
    var invRows=[];
    Object.keys(S.inv).forEach(function(k){var s=stockOf(k);if(s>0)invRows.push({k:k,s:s});});
    html+='<div style="margin-top:16px;font-size:13px;font-weight:700;color:var(--red);margin-bottom:6px;">Inventory on hand</div>';
    if(invRows.length){
      html+='<div style="background:var(--cream);border-radius:8px;padding:10px 14px;margin-bottom:8px;">';
      invRows.forEach(function(it){
        var soon=expiresThisRound(it.k, S.round+1);
        html+='<div style="display:flex;justify-content:space-between;font-size:14px;padding:2px 0;"><span>'+productName(it.k)+(soon?' <span style="color:'+BRAND.peach+';font-size:12px;">(expiring soon)</span>':'')+'</span><span style="font-weight:600;">'+it.s+'</span></div>';
      });
      html+='</div>';
    } else {
      html+='<div style="font-size:14px;opacity:.7;margin-bottom:8px;">Your shelves are empty.</div>';
    }

    // continue / bankrupt
    if(r.bankrupt){
      html+='<div style="background:rgba(164,68,62,.1);border:1.5px solid var(--red);border-radius:8px;padding:14px 16px;margin:14px 0;">'+
        '<div style="font-weight:700;color:var(--red);">Your season has ended.</div>'+
        '<div style="font-size:14px;margin-top:4px;">You can no longer afford to set up a booth with stock to sell. Every crafter has a rough season. You can always begin again.</div></div>'+
        '<button class="btn" onclick="ABE.toScore()">See your final score sheet</button>';
    } else {
      html+='<div style="display:flex;gap:12px;align-items:center;margin-top:14px;">'+
        '<button class="btn" onclick="ABE.next()">'+(r.round>=TOTAL_ROUNDS?"See your final score sheet":"Continue to next round")+'</button>'+
        '<button class="btn outline" onclick="ABE.quit()">End game now</button>'+
      '</div>';
    }
    html+='</div>';
  }

  else if(S.screen==="scoresheet"){
    var bankrupt=S.lastResult&&S.lastResult.bankrupt;
    var title=bankrupt?"Out of Business This Season":titleFor(S.totalProfit), played=S.history.length;
    var invRows=[];Object.keys(S.inv).forEach(function(k){var s=stockOf(k);if(s>0)invRows.push({k:k,s:s});});
    var linesWorked=S.selectedLines.length?S.selectedLines.map(function(id){return LINES[id].name;}).join(", "):"none";
    var invHTML=invRows.length?invRows.map(function(it){return '<div style="display:flex;justify-content:space-between;gap:18px;font-size:14px;padding:3px 0;"><span style="opacity:.75;">'+productName(it.k)+'</span><span style="font-weight:600;">'+it.s+' unsold</span></div>';}).join(""):'<div style="font-size:13px;opacity:.7;margin-top:4px;">Your shelves are empty.</div>';
    html='<div class="fade" style="text-align:center;padding:30px 10px;">'+
      '<img class="avimg" src="'+avatarSrc(S.avatarStyle)+'" width="84" height="84" alt="Your crafter" style="border:1.5px solid var(--amber);"/>'+
      '<div style="font-family:Parisienne,cursive;font-size:28px;color:var(--rose);margin-top:8px;">Your craft season</div>'+
      '<h1 style="font-weight:700;font-size:40px;color:var(--red);margin:6px 0 2px;">'+title+'</h1>'+
      (bankrupt?'<div style="font-size:14px;color:var(--red);max-width:420px;margin:6px auto 0;">You ran out of funds to keep your booth going. Try a leaner start next season.</div>':'')+
      '<div style="width:180px;height:2px;background:var(--amber);margin:16px auto 24px;"></div>'+
      '<div style="display:inline-block;text-align:left;background:#fff;border:1.5px solid rgba(42,31,30,.1);border-radius:12px;padding:22px 26px;min-width:300px;">'+
        statBox("Total profit", money(S.totalProfit), S.totalProfit>=0?BRAND.sageDeep:BRAND.red, true)+
        '<div style="height:14px;"></div>'+
        '<div style="display:flex;justify-content:space-between;gap:18px;font-size:14px;padding:3px 0;"><span style="opacity:.75;">Cash on hand</span><span style="font-weight:700;color:var(--sageDeep);">'+money(S.cash)+'</span></div>'+
        '<div style="display:flex;justify-content:space-between;gap:18px;font-size:14px;padding:3px 0;"><span style="opacity:.75;">Rounds played</span><span style="font-weight:600;">'+played+' of '+TOTAL_ROUNDS+'</span></div>'+
        '<div style="display:flex;justify-content:space-between;gap:18px;font-size:14px;padding:3px 0;"><span style="opacity:.75;">Lines worked</span><span style="font-weight:600;text-align:right;">'+linesWorked+'</span></div>'+
        '<div style="margin-top:14px;font-size:13px;font-weight:700;color:var(--red);">Leftover inventory</div>'+invHTML+
      '</div>'+
      '<div style="margin-top:28px;"><button class="btn" onclick="ABE.newGame()">Play again</button></div>'+
    '</div>';
  }

  app.innerHTML=html;
  window.scrollTo(0,0);
}

var ABE = {
  start:function(){ S.screen="rules"; render(); },
  toAvatar:function(){ S.screen="avatar"; render(); },
  begin:function(){ S.round=1; S.negStreak=0; S.negTotal=0; enterRound(); render(); },
  newGame:function(){ var a=S.avatarStyle; resetGame(); S.avatarStyle=a; S.round=1; enterRound(); render(); },
  setAvatar:function(n){ S.avatarStyle=n; render(); },
  pickLineToday:function(id){ if(S.selectedLines.length>=3 && S.selectedLines.indexOf(id)<0) return; if(S.lineToday!==id){ S.lineToday=id; S.make={}; } render(); },
  setBooth:function(id){ S.booth=id; render(); },
  setAds:function(id){ S.ads=id; render(); },
  liveMake:function(key,v){
    S.make[key]=Number(v);
    var safe=idSafe(key);
    var q=document.getElementById("q_"+safe); if(q)q.textContent=v;
    var c=calc();
    var wm=document.getElementById("walMat"); if(wm)wm.textContent=money(c.mat);
    var wt=document.getElementById("walTotal"); if(wt)wt.textContent=money(c.roundCost);
    var wa=document.getElementById("walAfter"); if(wa)wa.textContent=money(S.cash-c.roundCost);
    var btn=document.getElementById("confirmBtn"); if(btn)btn.disabled=!c.canConfirm;
    var rs=document.getElementById("walReason");
    if(rs){ rs.textContent = c.tooManyLines?"You can work in at most three lines. Lower one back to zero.":(!c.afford?"That costs more than you have on hand.":(!c.willHaveSomething?"Make at least one item, or you will have nothing to sell.":"")); }
  },
  setMake:function(key,v){ S.make[key]=Number(v); render(); },
  confirm:function(){
    var c=calc(); if(!c.canConfirm) return;
    var R=S.round, ev=EVENTS[S.event];
    // production
    Object.keys(S.make).forEach(function(k){ if(S.make[k]>0) addBatch(k,S.make[k],R); });
    makeLinesThisRound().forEach(function(l){ if(S.selectedLines.indexOf(l)<0 && S.selectedLines.length<3) S.selectedLines.push(l); });
    // visitors
    var favored=S.market.favors, trending=(ev.special==="trending")?S.trendingLine:null;
    var luck=0.85+Math.random()*0.30;
    var visitors=Math.max(0, Math.round(BASE_CROWD*boothObj().traffic*(1+adObj().boost)*ev.mod*luck));
    // distribute crowd across stocked products
    var prods=[]; Object.keys(S.inv).forEach(function(k){ var s=stockOf(k); if(s>0) prods.push({key:k,line:lineOfKey(k),stock:s}); });
    var totalW=0; prods.forEach(function(p){
      var price=LINES[p.line].price;
      var w=Math.pow(13/price,0.7);            // cheaper items draw more buyers
      if(favored.indexOf(p.line)>=0)w*=1.5;     // market favorite
      if(trending===p.line)w*=2;                // trending line
      w*=(0.45+Math.random()*1.1);              // daily per-product swing (0.45 to 1.55)
      p.w=w; totalW+=w;
    });
    var cap=PER_PRODUCT_CAP*visitors;
    var soldList=[], revenue=0;
    prods.forEach(function(p){
      var demand = totalW>0 ? (visitors*p.w/totalW) : 0;
      if(demand>cap)demand=cap;
      demand=Math.round(demand);
      var sold=Math.min(demand,p.stock);
      if(sold>0){ consume(p.key,sold); revenue+=sold*LINES[p.line].price; soldList.push({key:p.key,qty:sold,line:p.line}); }
    });
    // bulk order
    var bulk=null;
    if(ev.special==="bulk"){
      var avail=[]; Object.keys(S.inv).forEach(function(k){ if(stockOf(k)>0) avail.push(k); });
      var want=8+Math.floor(Math.random()*5); // 8..12
      if(avail.length){ var bk=avail[Math.floor(Math.random()*avail.length)]; var fill=Math.min(want,stockOf(bk)); consume(bk,fill); var rev=fill*LINES[lineOfKey(bk)].price; revenue+=rev; bulk={key:bk,want:want,fill:fill,rev:rev}; }
      else { bulk={key:null,want:want,fill:0,rev:0}; }
    }
    var roundCost=c.roundCost, profit=revenue-roundCost, newCash=S.cash-roundCost+revenue;
    S.cash=newCash; S.totalProfit+=profit;
    // expiry at end of day
    var expired=runExpiry(R);
    // bankruptcy check
    var bankrupt=false;
    if(S.cash<CHEAPEST_BOOTH) bankrupt=true;
    else if(totalStock()===0 && S.cash < (CHEAPEST_BOOTH + cheapestAccessibleCost())) bankrupt=true;
    S.lastResult={round:R,market:S.market.name,event:S.event,forecast:ev.forecast,visitors:visitors,
      favored:favored.slice(),trending:trending,soldList:soldList,revenue:revenue,cost:roundCost,profit:profit,
      cashAfter:newCash,bulk:bulk,expired:expired,bankrupt:bankrupt};
    S.history.push(S.lastResult);
    S.screen="selling"; S._skip=false; render();
    if(S._timer)clearTimeout(S._timer);
    S._timer=setTimeout(function(){ if(!S._skip) ABE.reveal(); }, 3000);
  },
  reveal:function(){ S._skip=true; if(S._timer){clearTimeout(S._timer);S._timer=null;} if(S.screen==="selling"){ S.screen="result"; render(); } },
  next:function(){
    if(S.lastResult&&S.lastResult.bankrupt){ S.screen="scoresheet"; render(); return; }
    if(S.round>=TOTAL_ROUNDS){ S.screen="scoresheet"; render(); return; }
    S.round++; enterRound(); render();
  },
  toScore:function(){ S.screen="scoresheet"; render(); },
  quit:function(){ S.screen="scoresheet"; render(); }
};
window.ABE=ABE;

render();
</script>
